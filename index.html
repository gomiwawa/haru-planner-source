<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="사이트를 만드는 중임을 알려 주는 시작 화면입니다.">
    <title>사이트 준비 중</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar" aria-hidden="true">
      <div class="brand"><span class="skeleton circle"></span><span class="skeleton brand-name"></span></div>
      <span class="skeleton search"></span>
      <span class="skeleton profile"></span>
    </header>

    <main class="page" aria-hidden="true">
      <aside class="sidebar">
        <span class="skeleton section-title"></span>
        <div class="nav-list">
          <span class="skeleton nav-line"></span><span class="skeleton nav-line short"></span>
          <span class="skeleton nav-line"></span><span class="skeleton nav-line medium"></span>
          <span class="skeleton nav-line short"></span><span class="skeleton nav-line"></span>
        </div>
      </aside>

      <article class="article">
        <div class="title-lines"><span class="skeleton eyebrow"></span><span class="skeleton title-line"></span><span class="skeleton title-line smaller"></span></div>
        <div class="skeleton image-placeholder"></div>
        <div class="author"><span class="skeleton circle"></span><span class="skeleton author-line"></span></div>
        <div class="paragraphs"><span class="skeleton text-line"></span><span class="skeleton text-line"></span><span class="skeleton text-line"></span><span class="skeleton text-line"></span><span class="skeleton text-line short"></span></div>
      </article>

      <aside class="cards">
        <div class="skeleton-card"><span class="skeleton circle"></span><span class="skeleton card-title"></span><span class="skeleton text-line"></span><span class="skeleton text-line short"></span><span class="skeleton button"></span></div>
        <div class="skeleton-card"><span class="skeleton circle"></span><span class="skeleton card-title"></span><span class="skeleton text-line"></span><span class="skeleton text-line short"></span><span class="skeleton button"></span></div>
      </aside>
    </main>

    <section class="notice" aria-live="polite" aria-atomic="true">
      <p class="notice-label">사이트 준비 중</p>
      <h1>사이트의 첫 화면을 만들고 있어요</h1>
      <p class="notice-copy">준비가 끝나면 이 자리에 사이트가 표시됩니다.</p>
    </section>
  </body>
</html>
